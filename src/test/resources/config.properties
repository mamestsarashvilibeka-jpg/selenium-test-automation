# =============================================================
# Test Framework Configuration
# Override any property via JVM: -Dbrowser=firefox
# =============================================================

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true for CI/CD)
headless=false

# Application URLs
base.url=https://www.saucedemo.com/
api.base.url=https://api.saucedemo.com/

# Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Test data
valid.username=standard_user
valid.password=secret_sauce

# Reporting
screenshot.on.failure=true
report.dir=reports/
allure.results.dir=allure-results/
